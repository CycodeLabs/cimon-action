name: Cimon by Cycode (Attest)
description: Generate, sign, and verify SLSA build provenance attestations. Supports Linux, Windows, and macOS runners (including GitHub Enterprise Server).
branding:
  icon: shield
  color: green
author: CycodeLabs
inputs:
  client-id:
    description: Cimon client ID for authentication
    required: false
  secret:
    description: Cimon secret for authentication
    required: false
  url:
    description: Cimon endpoint for authentication
    required: false
  release-path:
    description: Path to Cimon release file (Used for debugging)
    required: false
    default: ''
  subjects:
    description: A white space seperated list of paths, or base64-encoded subjects. Each path can be file, directory or image reference
    required: false
    default: ''
  source-path:
    description: |
      Path to the source checkout recorded in the attestation's
      resolvedDependencies. When unset, cimon discovers the source
      automatically: from the subject paths, a directory named after the
      CI run id, or the workspace. Set this when the source is checked
      out to a location discovery cannot reach.
    required: false
    default: ''
  skip-source-tree-check:
    description: Skip verifying that the source working tree matches the recorded commit (faster on very large trees)
    required: false
    default: 'false'
  image-ref:
    description: (deprecated) The container reference to generate provenance for. Either subjects or imageRef are required
    required: false
    default: ''
  sign-key:
    description: Input path to a private ECDSA/RSA/ED25519 key used to sign provenance statement
    required: false
    default: ''
  kms:
    description: 'KMS key used to sign the provenance statement (and the SBOM attestation when sbom is set), as a provider URI. HashiCorp Vault transit: vault://<key-name>, with the Vault address and token in the VAULT_ADDR and VAULT_TOKEN environment variables. Requires cimon v1.0.28 or later.'
    required: false
    default: ''
  keyless:
    description: Allow keyless signature if no signing key is provided
    required: false
    default: 'false'
  tlog-upload:
    description: 'Keyless signing only: allow the creation of a Rekor transparency log (TLog) entry. Ignored unless keyless is true.'
    required: false
    default: 'true'
  include-timestamp:
    description: 'Request an RFC 3161 timestamp of the artifact signature from a timestamping authority. Applies to keyless, sign-key and kms signing.'
    required: false
    default: 'false'
  fulcio-server-url:
    description: 'Keyless signing only: Fulcio server URL'
    required: false
    default: 'https://fulcio.sigstore.dev'
  rekor-server-url:
    description: 'Keyless signing only: Rekor server URL'
    required: false
    default: 'https://rekor.sigstore.dev'
  timestamp-server-url:
    description: 'RFC 3161 timestamp server URL: a Sigstore timestamp authority or a standard RFC 3161 service. With sign-key or kms, forwarded only when include-timestamp is true.'
    required: false
  allow-submit-data-to-public-sigstore:
    description: 'Keyless signing only: agree to submit data to an immutable public transparency log (needed for public Sigstore). Ignored unless keyless is true.'
    required: false
    default: 'false'
  provenance-output:
    description: Provenance output path. Can be absolute path, or relative path to the default working directory
    required: false
    default: 'provenance.intoto.jsonl'
  signed-provenance-output:
    description: Signed provenance output path. Can be absolute path, or relative path to the default working directory
    required: false
    default: 'provenance.intoto.jsonl.sig'
  sbom:
    description: |
      Path to an SBOM produced by another tool (syft, Microsoft sbom-tool,
      cyclonedx-py, ...) to attest alongside the provenance. Accepts
      CycloneDX (JSON or XML) and SPDX 2.x (JSON, YAML or tag-value). When
      set, the action runs `cimon attest sbom` over the same subjects with
      the same signing settings after the provenance run. Requires cimon
      v1.0.27 or later. This is the way to get a signed SBOM attestation
      on Windows and macOS, where the Cimon agent (automatic SBOM
      generation) is not available.
    required: false
    default: ''
  signed-sbom-output:
    description: Signed SBOM attestation output path. Can be absolute path, or relative path to the default working directory. Used only when sbom is set
    required: false
    default: 'sbom.intoto.jsonl.sig'
  github-token:
    description: GitHub token for enriching build information
    required: false
    default: ${{ github.token }}
  report-job-summary:
    description: Enable to report the provenance documents as job summary output
    required: false
    default: 'true'
  report-artifact:
    description: Enable to report the provenance documents as job artifacts
    required: false
    default: 'true'
  log-level:
    description: Log level (Used for debugging)
    required: false
    default: 'info'
  fail-on-error:
    description: Fail the CI if Cimon encountered an error
    required: false
    default: 'false'

outputs:
  cimon-path:
    description: |
      Absolute path to the installed cimon (or cimon.exe) binary used by
      this action invocation. Downstream steps in the same job can also
      reach the binary via the CIMON_PATH env var, or call `cimon` /
      `cimon.exe` directly since the action adds the install dir to PATH.
  signed-sbom-path:
    description: |
      Path of the signed SBOM attestation written by `cimon attest sbom`.
      Empty when the sbom input is not set.

runs:
  using: node20
  main: 'dist/index.js'
