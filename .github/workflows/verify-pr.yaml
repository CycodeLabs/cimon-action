---
name: Verify Pull Request

on:
  pull_request:
    branches:
      - main
      - release/v0

permissions:
  contents: read

# Cancel any in-flight jobs for the same pull request so there is only one job active at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-attest-windows:
    # Validates the cross-platform attestation path on Windows. Uses the
    # same `./attest` action the customer would use on a GHES self-hosted
    # Windows runner. Keyed signing path (offline, data-residency safe).
    #
    # As of #118, the Windows install path resolves the latest tag from
    # cycodelabs/cimon-releases and downloads cimon_windows_x86_64.zip
    # directly from the GitHub release — no S3 install.ps1 dependency,
    # so this job is end-to-end runnable.
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Build sample Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/sample.exe -Value "fake-windows-binary-$(Get-Date -Format o)"

      - name: Generate ephemeral signing key
        shell: pwsh
        run: |
          & "C:\Program Files\Git\usr\bin\openssl.exe" genrsa -out private-key.pem 3072

      # The agent (automatic SBOM generation) is Linux-only, so on Windows
      # an SBOM comes from another tool and is signed via the `sbom` input.
      # A minimal CycloneDX document stands in for a real generator here.
      - name: Write sample CycloneDX SBOM
        shell: pwsh
        run: |
          @'
          {"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"components":[{"type":"application","name":"sample","version":"0.0.1"}]}
          '@ | Set-Content -Path sbom.cdx.json

      - name: Cimon Attest (Windows, keyed)
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret:    ${{ secrets.CIMON_SECRET }}
          subjects:  dist\sample.exe
          sign-key:  private-key.pem
          sbom:      sbom.cdx.json
          report-job-summary: true
          report-artifact:    true
          fail-on-error:      true

      - name: Show provenance and SBOM attestation
        shell: pwsh
        run: |
          Get-Content provenance.intoto.jsonl
          Get-Item sbom.intoto.jsonl.sig | Select-Object FullName, Length

  verify-agent-windows-inputs:
    # On Windows the agent generates SBOMs only. Inputs for Linux-only
    # features must fail the step before anything is downloaded.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Run Cimon with a Linux-only input
        id: cimon
        continue-on-error: true
        uses: ./
        with:
          prevent: true
          fail-on-error: true

      - name: Check that the step failed without starting the agent
        shell: pwsh
        env:
          OUTCOME: ${{ steps.cimon.outcome }}
        run: |
          if ($env:OUTCOME -ne 'failure') { throw "expected the Cimon step to fail, got $env:OUTCOME" }
          if (Get-Process -Name cimon -ErrorAction SilentlyContinue) { throw 'the agent was started' }

  verify-agent-windows-download:
    # The download a Windows job makes without release-path: the latest v1
    # release's zip, verified by the cosign signature on checksums.txt and
    # its SHA-256, then unpacked. Until a release carries the Windows agent,
    # the step then stops at the attest-only check; once one does, the
    # agent starts.
    runs-on: windows-latest
    env:
      CIMON_SBOM_ENABLED: 'true'
      CIMON_FORCE_SENSORS: 'true'
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Run Cimon from the latest release
        id: cimon
        continue-on-error: true
        uses: ./
        with:
          fail-on-error: true

      - name: Check the release was downloaded, verified and unpacked
        shell: pwsh
        env:
          OUTCOME: ${{ steps.cimon.outcome }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'cimon-v1\cimon\cimon.exe'
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'cimon-v1\cosign-windows-amd64.exe'))) { throw 'cosign was not installed to verify the release' }
          # The archive is unpacked only after its signature and digest check.
          if (-not (Test-Path $exe)) { throw "the release was not unpacked to $exe" }
          & $exe attest --help | Out-Null
          if ($LASTEXITCODE) { throw "the release's cimon.exe does not run ($LASTEXITCODE)" }
          & $exe agent --help 2>&1 | Out-Null
          $hasAgent = $LASTEXITCODE -eq 0
          Write-Host "The latest v1 release has the Windows agent: $hasAgent. The Cimon step's outcome: $env:OUTCOME"
          if ($hasAgent -and $env:OUTCOME -ne 'success') { throw 'the release has the Windows agent, but the step failed' }
          if (-not $hasAgent -and $env:OUTCOME -ne 'failure') { throw 'an attest-only release did not stop the step' }
          # The step's exit code is otherwise the last native command's: agent --help's.
          exit 0

  verify-agent-windows-rc:
    # A Windows job as a customer tests a release candidate: the action
    # downloads it by the version input, verified like a release, and starts the
    # agent, authenticated, with keyless SBOM signing; a CMake build with MSVC
    # and Ninja then gets a signed SBOM. verify-agent-windows-rc-artifacts
    # checks what the job left behind.
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
    env:
      CIMON_RC: v1.0.30-rc-windows-1
      CIMON_SBOM_ENABLED: 'true'
      CIMON_SBOM_SIGN_ENABLED: 'true'
      CIMON_KEYLESS: 'true'
      CIMON_ALLOW_SUBMIT: 'true'
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Start Cimon from the release candidate
        uses: ./
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          version: ${{ env.CIMON_RC }}
          log-level: debug
          fail-on-error: true
          sbom-artifact-name: cimon-sbom-rc

      - name: Build a C++ program with CMake and Ninja
        shell: pwsh
        run: |
          $src = Join-Path $env:RUNNER_TEMP 'sample'
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Set-Content -Path (Join-Path $src 'CMakeLists.txt') -Value @(
            'cmake_minimum_required(VERSION 3.21)',
            'project(sample CXX)',
            'add_executable(sample main.cpp)',
            'target_link_libraries(sample PRIVATE ws2_32)'
          )
          Set-Content -Path (Join-Path $src 'main.cpp') -Value @(
            '#include <winsock2.h>',
            '#include <cstdio>',
            'int main() { WSADATA d; std::printf("%d\n", WSAStartup(MAKEWORD(2, 2), &d)); return 0; }'
          )
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$(Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat')`" x64 >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2]) }
          }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            python -m pip install --quiet ninja
            $env:PATH = (python -c "import ninja; print(ninja.BIN_DIR)") + ";$env:PATH"
          }
          $build = Join-Path $env:RUNNER_TEMP 'sample-build'
          cmake -S $src -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE) { throw "configure failed ($LASTEXITCODE)" }
          cmake --build $build
          if ($LASTEXITCODE) { throw "build failed ($LASTEXITCODE)" }

  verify-agent-windows-rc-artifacts:
    needs: verify-agent-windows-rc
    runs-on: ubuntu-22.04
    env:
      CIMON_RC: v1.0.30-rc-windows-1
    steps:
      - name: Download what the job left
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: '{cimon-sbom-rc,cimon-agent-log-verify-agent-windows-rc}'
          path: left

      - name: Check the release candidate's agent, its SBOM and signatures
        run: |
          find left -type f
          cdx=$(find left/cimon-sbom-rc -name sbom.cdx.json | head -1)
          spdx=$(find left/cimon-sbom-rc -name sbom.spdx.json | head -1)
          log=$(find left/cimon-agent-log-verify-agent-windows-rc -name cimon-agent.log | head -1)
          [ -n "$cdx" ] && [ -n "$spdx" ] || { echo "::error::no SBOM in the artifact"; exit 1; }
          [ -f "$cdx.sig" ] && [ -f "$spdx.sig" ] || { echo "::error::the SBOM signatures are missing"; exit 1; }
          jq -e '.metadata.component.name == "sample.exe" or ([.components[].name] | index("sample.exe"))' "$cdx" > /dev/null \
            || { echo "::error::the SBOM does not describe sample.exe"; exit 1; }
          jq -e '[.components[].name] | (index("windows-sdk") != null) and (index("vc-runtime") != null)' "$cdx" > /dev/null \
            || { echo "::error::the SBOM lacks the Windows SDK or the MSVC runtime"; exit 1; }
          version=$(grep -h '"Cimon started successfully"' "$log" | jq -r '.version' | head -1)
          [ "$version" = "$CIMON_RC" ] || { echo "::error::the agent was $version, not $CIMON_RC"; exit 1; }
          signed=$(grep -h '"SBOMs signed"' "$log" | jq -r '.signatures' | tail -1)
          [ "$signed" = "2" ] || { echo "::error::the agent signed $signed SBOMs, not 2"; exit 1; }
          grep -q '"Successfully authenticated"' "$log" || { echo "::error::the agent did not authenticate"; exit 1; }
          hint=$(grep -h '"message":"SBOM diagnosis"' "$log" | jq -r '.hint' | tail -1)
          [ -z "$hint" ] || { echo "::error::the diagnosis has a hint: $hint"; exit 1; }
          echo "The release candidate $version wrote and signed the SBOM of sample.exe ($(jq '.components | length' "$cdx") components)."

  verify-attest-macos:
    # On macOS the attest action downloads the latest release, verifies the
    # cosign signature on its checksums.txt and the archive's SHA256, then
    # runs it. Keyed signing, as on Windows.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Build sample artifact and signing key
        run: |
          mkdir -p dist
          echo "fake-macos-binary-$(date -u +%s)" > dist/sample
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out private-key.pem

      - name: Cimon Attest (macOS, keyed)
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret:    ${{ secrets.CIMON_SECRET }}
          subjects:  dist/sample
          sign-key:  private-key.pem
          report-job-summary: true
          report-artifact:    false
          fail-on-error:      true

      - name: Show provenance
        run: |
          cat provenance.intoto.jsonl
          ls -l provenance.intoto.jsonl.sig

  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      # A binary an earlier job left at the install path must not be reused:
      # without a version the action installs the latest release every run.
      # If it ran this one, starting the agent would fail the next step.
      - name: Leave a stale binary at the install path
        run: |
          mkdir -p /tmp/cimon
          printf '#!/bin/sh\necho "stale binary was reused" >&2\nexit 1\n' > /tmp/cimon/cimon
          chmod +x /tmp/cimon/cimon

      - name: Run Cimon
        uses: ./
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          prevent: true
          allowed-hosts: >
            cycode.com
            registry.npmjs.org
          report-process-tree: true
          fail-on-error: true

      - name: Test
        run: |
          curl -I https://api.github.com
          curl -I https://cycode.com
          wget --quiet --timeout 1 https://registry.npmjs.org || true

  verify-in-container:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.18
      options: --privileged
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Install dependencies
        run: |
          apk update
          apk add curl wget

      - name: Run Cimon
        uses: ./
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          prevent: true
          allowed-hosts: >
            cycode.com
            registry.npmjs.org
          report-process-tree: true
          fail-on-error: true

      - name: Test
        run: |
          curl -I https://api.github.com
          curl -I https://cycode.com
          wget --quiet --timeout 1 https://registry.npmjs.org || true

  verify-provenance:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Create Private Key
        run: |
          openssl genrsa -out private-key.pem 3072

      - name: Run Cimon
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: NDgyY2U4YzhmN2U4NjdkYTNhM2MwNWE5YWVlNjM3NzAzZTE3NDcwZWQxY2Y4ODJhOWU1YjQwNWU4ZjgyNjE5ZCAgYXJ0aWZhY3QxCjg5Y2ZjNjk1NGU4OGIyZjkyYTdjMjg3OWQ5ZWIwODVjNDJmM2M3MDY1ZDAxMmE1MDY2ZjQ1MGRiZTU5YjJjMDAgIGFydGlmYWN0Mgo=
          sign-key: private-key.pem
          report-job-summary: true
          report-artifact: true
          fail-on-error: true

  verify-provenance-image-ref:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Create Private Key
        run: |
          openssl genrsa -out private-key.pem 3072

      - name: Run Cimon
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: 'cycodelabs/cimon@sha256:ad4ab84178621f359a5ec1ba9eff8ba46626d8d1999416646b6aaa96bfcbf802'
          sign-key: private-key.pem
          report-job-summary: true
          report-artifact: true
          fail-on-error: true

  verify-agent-and-attest:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Run Cimon Agent
        uses: ./
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          report-process-tree: true
          fail-on-error: true

      - name: Create Artifact
        run: |
          echo artifact > artifact.txt

      - name: Run Cimon Attest
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: artifact.txt
          report-job-summary: true
          fail-on-error: true

      - name: Test
        run: |
          curl -I https://api.github.com
          curl -I https://cycode.com
          wget --quiet --timeout 1 https://registry.npmjs.org || true

  # The version input pins the Cimon release instead of running the latest
  # one. PINNED_VERSION is deliberately older than the latest release, and
  # each job compares the binary the action ran with the one in that
  # release, so the test fails if the action falls back to the latest.
  verify-pinned-version:
    runs-on: ubuntu-22.04
    env:
      PINNED_VERSION: v1.0.27
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Run Cimon (pinned)
        uses: ./
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          version: ${{ env.PINNED_VERSION }}
          fail-on-error: true

      # The action starts the agent from /tmp/cimon-v1/cimon after verifying
      # it, and fail-on-error fails the previous step if the start fails.
      - name: Check the pinned binary ran
        run: |
          curl -sSfL -o expected.tar.gz \
            "https://github.com/CycodeLabs/cimon-releases/releases/download/${PINNED_VERSION}/cimon_linux_x86_64.tar.gz"
          mkdir expected && tar -xzf expected.tar.gz -C expected
          cmp expected/cimon /tmp/cimon-v1/cimon

  verify-attest-pinned-linux:
    runs-on: ubuntu-22.04
    env:
      PINNED_VERSION: v1.0.27
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Create Private Key and Artifact
        run: |
          openssl genrsa -out private-key.pem 3072
          echo artifact > artifact.txt

      - name: Run Cimon Attest (pinned)
        id: attest
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: artifact.txt
          sign-key: private-key.pem
          version: ${{ env.PINNED_VERSION }}
          report-artifact: false
          fail-on-error: true

      - name: Check the pinned binary ran
        env:
          CIMON_RAN: ${{ steps.attest.outputs.cimon-path }}
        run: |
          curl -sSfL -o expected.tar.gz \
            "https://github.com/CycodeLabs/cimon-releases/releases/download/${PINNED_VERSION}/cimon_linux_x86_64.tar.gz"
          mkdir expected && tar -xzf expected.tar.gz -C expected
          cmp expected/cimon "$CIMON_RAN"

      - name: Run Cimon Attest with both release-path and version
        id: conflict
        continue-on-error: true
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: artifact.txt
          sign-key: private-key.pem
          release-path: ${{ steps.attest.outputs.cimon-path }}
          version: ${{ env.PINNED_VERSION }}
          report-artifact: false
          fail-on-error: true

      - name: Check that combination was rejected
        if: steps.conflict.outcome != 'failure'
        run: |
          echo "::error::release-path together with version should fail the step"
          exit 1

      # A version that does not exist is an input mistake: it fails the
      # step even with fail-on-error: false.
      - name: Run Cimon Attest with a version that does not exist
        id: unknown
        continue-on-error: true
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: artifact.txt
          sign-key: private-key.pem
          version: v1.0.999
          report-artifact: false
          fail-on-error: false

      - name: Check the unknown version failed the step
        if: steps.unknown.outcome != 'failure'
        run: |
          echo "::error::an unknown version should fail the step even with fail-on-error: false"
          exit 1

  verify-attest-pinned-windows:
    runs-on: windows-latest
    env:
      PINNED_VERSION: v1.0.27
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Build sample Windows artifact and signing key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/sample.exe -Value "fake-windows-binary-$(Get-Date -Format o)"
          & "C:\Program Files\Git\usr\bin\openssl.exe" genrsa -out private-key.pem 3072

      # The leading "v" is optional; leaving it out also tests that.
      - name: Cimon Attest (Windows, pinned)
        id: attest
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret:    ${{ secrets.CIMON_SECRET }}
          subjects:  dist\sample.exe
          sign-key:  private-key.pem
          version:   1.0.27
          report-artifact: false
          fail-on-error:   true

      # A second attest step in the same job installs its own binary and
      # leaves the first step's install, and cimon-path, alone.
      - name: Cimon Attest (Windows, latest, second step)
        id: attest_latest
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret:    ${{ secrets.CIMON_SECRET }}
          subjects:  dist\sample.exe
          sign-key:  private-key.pem
          report-artifact: false
          fail-on-error:   true

      - name: Check the pinned binary ran
        shell: pwsh
        env:
          CIMON_RAN: ${{ steps.attest.outputs.cimon-path }}
          CIMON_LATEST: ${{ steps.attest_latest.outputs.cimon-path }}
        run: |
          if ($env:CIMON_RAN -eq $env:CIMON_LATEST) { throw "both attest steps reported the same cimon-path: $env:CIMON_RAN" }
          $url = "https://github.com/CycodeLabs/cimon-releases/releases/download/$env:PINNED_VERSION/cimon_windows_x86_64.zip"
          Invoke-WebRequest $url -OutFile expected.zip
          Expand-Archive expected.zip -DestinationPath expected
          $want = (Get-FileHash expected\cimon.exe -Algorithm SHA256).Hash
          $got  = (Get-FileHash $env:CIMON_RAN -Algorithm SHA256).Hash
          if ($want -ne $got) { throw "the action ran $got, expected $env:PINNED_VERSION ($want)" }
