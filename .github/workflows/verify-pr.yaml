---
name: Verify Pull Request

on:
  pull_request:
    branches:
      - main
      - release/v0

permissions:
  contents: read

# Cancel any in-flight jobs for the same pull request so there is only one job active at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-attest-windows:
    # Validates the cross-platform attestation path on Windows. Uses the
    # same `./attest` action the customer would use on a GHES self-hosted
    # Windows runner. Keyed signing path (offline, data-residency safe).
    #
    # As of #118, the Windows install path resolves the latest tag from
    # cycodelabs/cimon-releases and downloads cimon_windows_x86_64.zip
    # directly from the GitHub release — no S3 install.ps1 dependency,
    # so this job is end-to-end runnable.
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Build sample Windows artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/sample.exe -Value "fake-windows-binary-$(Get-Date -Format o)"

      - name: Generate ephemeral signing key
        shell: pwsh
        run: |
          & "C:\Program Files\Git\usr\bin\openssl.exe" genrsa -out private-key.pem 3072

      # The agent (automatic SBOM generation) is Linux-only, so on Windows
      # an SBOM comes from another tool and is signed via the `sbom` input.
      # A minimal CycloneDX document stands in for a real generator here.
      - name: Write sample CycloneDX SBOM
        shell: pwsh
        run: |
          @'
          {"bomFormat":"CycloneDX","specVersion":"1.5","version":1,"components":[{"type":"application","name":"sample","version":"0.0.1"}]}
          '@ | Set-Content -Path sbom.cdx.json

      - name: Cimon Attest (Windows, keyed)
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret:    ${{ secrets.CIMON_SECRET }}
          subjects:  dist\sample.exe
          sign-key:  private-key.pem
          sbom:      sbom.cdx.json
          report-job-summary: true
          report-artifact:    true
          fail-on-error:      true

      - name: Show provenance and SBOM attestation
        shell: pwsh
        run: |
          Get-Content provenance.intoto.jsonl
          Get-Item sbom.intoto.jsonl.sig | Select-Object FullName, Length

  verify-attest-macos:
    # On macOS the attest action downloads the latest release, verifies the
    # cosign signature on its checksums.txt and the archive's SHA256, then
    # runs it. Keyed signing, as on Windows.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Build sample artifact and signing key
        run: |
          mkdir -p dist
          echo "fake-macos-binary-$(date -u +%s)" > dist/sample
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out private-key.pem

      - name: Cimon Attest (macOS, keyed)
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret:    ${{ secrets.CIMON_SECRET }}
          subjects:  dist/sample
          sign-key:  private-key.pem
          report-job-summary: true
          report-artifact:    false
          fail-on-error:      true

      - name: Show provenance
        run: |
          cat provenance.intoto.jsonl
          ls -l provenance.intoto.jsonl.sig

  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      # A binary an earlier job left at the install path must not be reused:
      # without a version the action installs the latest release every run.
      # If it ran this one, starting the agent would fail the next step.
      - name: Leave a stale binary at the install path
        run: |
          mkdir -p /tmp/cimon
          printf '#!/bin/sh\necho "stale binary was reused" >&2\nexit 1\n' > /tmp/cimon/cimon
          chmod +x /tmp/cimon/cimon

      - name: Run Cimon
        uses: ./
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          prevent: true
          allowed-hosts: >
            cycode.com
            registry.npmjs.org
          report-process-tree: true
          fail-on-error: true

      - name: Test
        run: |
          curl -I https://api.github.com
          curl -I https://cycode.com
          wget --quiet --timeout 1 https://registry.npmjs.org || true

  verify-in-container:
    runs-on: ubuntu-22.04
    container:
      image: alpine:3.18
      options: --privileged
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Install dependencies
        run: |
          apk update
          apk add curl wget

      - name: Run Cimon
        uses: ./
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          prevent: true
          allowed-hosts: >
            cycode.com
            registry.npmjs.org
          report-process-tree: true
          fail-on-error: true

      - name: Test
        run: |
          curl -I https://api.github.com
          curl -I https://cycode.com
          wget --quiet --timeout 1 https://registry.npmjs.org || true

  verify-provenance:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Create Private Key
        run: |
          openssl genrsa -out private-key.pem 3072

      - name: Run Cimon
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: NDgyY2U4YzhmN2U4NjdkYTNhM2MwNWE5YWVlNjM3NzAzZTE3NDcwZWQxY2Y4ODJhOWU1YjQwNWU4ZjgyNjE5ZCAgYXJ0aWZhY3QxCjg5Y2ZjNjk1NGU4OGIyZjkyYTdjMjg3OWQ5ZWIwODVjNDJmM2M3MDY1ZDAxMmE1MDY2ZjQ1MGRiZTU5YjJjMDAgIGFydGlmYWN0Mgo=
          sign-key: private-key.pem
          report-job-summary: true
          report-artifact: true
          fail-on-error: true

  verify-provenance-image-ref:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Create Private Key
        run: |
          openssl genrsa -out private-key.pem 3072

      - name: Run Cimon
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: 'cycodelabs/cimon@sha256:ad4ab84178621f359a5ec1ba9eff8ba46626d8d1999416646b6aaa96bfcbf802'
          sign-key: private-key.pem
          report-job-summary: true
          report-artifact: true
          fail-on-error: true

  verify-agent-and-attest:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Run Cimon Agent
        uses: ./
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          report-process-tree: true
          fail-on-error: true

      - name: Create Artifact
        run: |
          echo artifact > artifact.txt

      - name: Run Cimon Attest
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: artifact.txt
          report-job-summary: true
          fail-on-error: true

      - name: Test
        run: |
          curl -I https://api.github.com
          curl -I https://cycode.com
          wget --quiet --timeout 1 https://registry.npmjs.org || true

  # The version input pins the Cimon release instead of running the latest
  # one. PINNED_VERSION is deliberately older than the latest release, and
  # each job compares the binary the action ran with the one in that
  # release, so the test fails if the action falls back to the latest.
  verify-pinned-version:
    runs-on: ubuntu-22.04
    env:
      PINNED_VERSION: v1.0.27
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Run Cimon (pinned)
        uses: ./
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          version: ${{ env.PINNED_VERSION }}
          fail-on-error: true

      # The action starts the agent from /tmp/cimon-v1/cimon after verifying
      # it, and fail-on-error fails the previous step if the start fails.
      - name: Check the pinned binary ran
        run: |
          curl -sSfL -o expected.tar.gz \
            "https://github.com/CycodeLabs/cimon-releases/releases/download/${PINNED_VERSION}/cimon_linux_x86_64.tar.gz"
          mkdir expected && tar -xzf expected.tar.gz -C expected
          cmp expected/cimon /tmp/cimon-v1/cimon

  verify-attest-pinned-linux:
    runs-on: ubuntu-22.04
    env:
      PINNED_VERSION: v1.0.27
    steps:
      - name: Checkout Code
        uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Create Private Key and Artifact
        run: |
          openssl genrsa -out private-key.pem 3072
          echo artifact > artifact.txt

      - name: Run Cimon Attest (pinned)
        id: attest
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: artifact.txt
          sign-key: private-key.pem
          version: ${{ env.PINNED_VERSION }}
          report-artifact: false
          fail-on-error: true

      - name: Check the pinned binary ran
        env:
          CIMON_RAN: ${{ steps.attest.outputs.cimon-path }}
        run: |
          curl -sSfL -o expected.tar.gz \
            "https://github.com/CycodeLabs/cimon-releases/releases/download/${PINNED_VERSION}/cimon_linux_x86_64.tar.gz"
          mkdir expected && tar -xzf expected.tar.gz -C expected
          cmp expected/cimon "$CIMON_RAN"

      - name: Run Cimon Attest with both release-path and version
        id: conflict
        continue-on-error: true
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: artifact.txt
          sign-key: private-key.pem
          release-path: ${{ steps.attest.outputs.cimon-path }}
          version: ${{ env.PINNED_VERSION }}
          report-artifact: false
          fail-on-error: true

      - name: Check that combination was rejected
        if: steps.conflict.outcome != 'failure'
        run: |
          echo "::error::release-path together with version should fail the step"
          exit 1

      # A version that does not exist is an input mistake: it fails the
      # step even with fail-on-error: false.
      - name: Run Cimon Attest with a version that does not exist
        id: unknown
        continue-on-error: true
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret: ${{ secrets.CIMON_SECRET }}
          subjects: artifact.txt
          sign-key: private-key.pem
          version: v1.0.999
          report-artifact: false
          fail-on-error: false

      - name: Check the unknown version failed the step
        if: steps.unknown.outcome != 'failure'
        run: |
          echo "::error::an unknown version should fail the step even with fail-on-error: false"
          exit 1

  verify-attest-pinned-windows:
    runs-on: windows-latest
    env:
      PINNED_VERSION: v1.0.27
    steps:
      - uses: actions/checkout@8e5e7e5ab8b370d6c329ec480221332ada57f0ab # v3.5.2

      - name: Build sample Windows artifact and signing key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Set-Content -Path dist/sample.exe -Value "fake-windows-binary-$(Get-Date -Format o)"
          & "C:\Program Files\Git\usr\bin\openssl.exe" genrsa -out private-key.pem 3072

      # The leading "v" is optional; leaving it out also tests that.
      - name: Cimon Attest (Windows, pinned)
        id: attest
        uses: ./attest
        with:
          client-id: ${{ secrets.CIMON_CLIENT_ID }}
          secret:    ${{ secrets.CIMON_SECRET }}
          subjects:  dist\sample.exe
          sign-key:  private-key.pem
          version:   1.0.27
          report-artifact: false
          fail-on-error:   true

      - name: Check the pinned binary ran
        shell: pwsh
        env:
          CIMON_RAN: ${{ steps.attest.outputs.cimon-path }}
        run: |
          $url = "https://github.com/CycodeLabs/cimon-releases/releases/download/$env:PINNED_VERSION/cimon_windows_x86_64.zip"
          Invoke-WebRequest $url -OutFile expected.zip
          Expand-Archive expected.zip -DestinationPath expected
          $want = (Get-FileHash expected\cimon.exe -Algorithm SHA256).Hash
          $got  = (Get-FileHash $env:CIMON_RAN -Algorithm SHA256).Hash
          if ($want -ne $got) { throw "the action ran $got, expected $env:PINNED_VERSION ($want)" }
